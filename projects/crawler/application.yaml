name: ai-space
environment: development
crawl:
  entry_spider: "news"
  start_requests:
    - url: https://books.toscrape.com/

runtime:

  engine:
    concurrency: 8
    timeout: 30

  throttle:
    delay: 0.5
    concurrency: 2
proxies:
  - name: default
    type: static
    proxy:
      url: socks5://127.0.0.1:1080

  - name: france
    type: country
    country: FR
    proxies:
      - url: socks5://127.0.0.1:1081
        country: FR
      - url: socks5://127.0.0.1:1082
        country: FR
user_agents:
  - name: chrome
    type: static
    user_agent: "Mozilla/5.0 ..."

  - name: firefox
    type: static
    user_agent: "Mozilla/5.0 ..."

  - name: default
    type: fake

  - name: pool
    type: pool
    strategy: random
    providers:
      - chrome
      - firefox
      - default

auth_providers:
  - name: default
    type: basic
    username: crawler
    password: secret

  - name: weather_api
    type: api_key
    key: "abc123"
    header: "X-API-Key"

  - name: github_api
    type: bearer
    token: "ghp_xxxxxxxxx"

  - name: website_session
    type: cookie
    cookies:
      sessionid: "abc123"
      csrftoken: "xyz456"

  - name: oauth_api
    type: oauth2_client_credentials
    token_url: "https://example.com/oauth/token"
    client_id: "crawler"
    client_secret: "secret"
    scope: "read"
    timeout: 10
    token_expiry_margin: 30

output_sinks:
  - name: news_jsonl
    type: jsonl
    path: data/news.jsonl
  - name: news_csv
    type: csv
    path: data/news.csv
  # - name: news_postgres
  #   type: postgres
  #   dsn: postgresql+asyncpg://aiuser:password@postgres:5432/aispace
  #   table: news
spiders:

  - name: news
    template: list
    kind: list

    profile:
      downloader:
        type: scrapy


      response_format: html



    middlewares:
      - type: fingerprint
      - type: deduplicate
      - type: cache
      - type: session
      - type: cookie
      - type: header
      - type: user_agent
      - type: auth
      - type: proxy
      - type: response_validation
      - type: robot
      - type: retry
      - type: throttle
    outputs:
      - news_jsonl
      - news_csv
    extraction:
      name: cloth_list
      type: list

      selector:
        type: css
        selector: "li article.product_pod"
        selection: multiple

      item:
        name: cloth
        type: object

        children:

          # - name: image_url
          #   type: field
          #   source:
          #     type: selector
          #     selector:
          #       type: css
          #       selector: "img"
          #       selection: single
          #       extract: attribute
          #       attribute: data-original

          #   transforms:
          #     - type: prefix
          #       value: "https:"

          - name: name
            type: field
            source:
              type: selector
              selector:
                type: css
                selector: "h3 a"
                selection: single
                extract: text

          - name: price
            type: field
            source:
              type: selector
              selector:
                type: css
                selector: "p.price_color"
                selection: single
                extract: text

    # discovery:

    #   - type: detail_link

    #     selector:
    #       type: css
    #       selector: "article a"

    #   - type: next_page

    #     selector:
    #       type: css
    #       selector: "a.next"