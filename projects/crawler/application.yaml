name: ai-space
environment: development
default_spider: news

runtime:

  engine:
    concurrency: 8
    timeout: 30

  throttle:
    delay: 0.5
    concurrency: 2
proxies:
  - name: default
    type: static
    proxy:
      url: socks5://127.0.0.1:1080

  - name: france
    type: country
    country: FR
    proxies:
      - url: socks5://127.0.0.1:1081
        country: FR
      - url: socks5://127.0.0.1:1082
        country: FR
user_agents:
  - name: chrome
    type: static
    user_agent: "Mozilla/5.0 ..."

  - name: firefox
    type: static
    user_agent: "Mozilla/5.0 ..."

  - name: default
    type: fake

  - name: pool
    type: pool
    strategy: random
    providers:
      - chrome
      - firefox
      - default

auth_providers:
  - name: default
    type: basic
    username: crawler
    password: secret

  - name: weather_api
    type: api_key
    key: "abc123"
    header: "X-API-Key"

  - name: github_api
    type: bearer
    token: "ghp_xxxxxxxxx"

  - name: website_session
    type: cookie
    cookies:
      sessionid: "abc123"
      csrftoken: "xyz456"

  - name: oauth_api
    type: oauth2_client_credentials
    token_url: "https://example.com/oauth/token"
    client_id: "crawler"
    client_secret: "secret"
    scope: "read"
    timeout: 10
    token_expiry_margin: 30
spiders:

  - name: news
    template: list
    kind: list

    profile:
      downloader:
        type: scrapy


      response_format: html

    start_requests:
      - url: https://example.com/news

    middlewares:
      - type: fingerprint
      - type: deduplicate
      - type: cache
      - type: session
      - type: cookie
      - type: header
      - type: user_agent
      - type: auth
      - type: proxy
      - type: response_validation
      - type: robot
      - type: retry
      - type: throttle
    extraction:

      type: object
      name: article

      children:

        - type: field
          name: title

          source:
            type: selector

            selector:
              type: css
              selector: "title"

          required: false

          transforms:
            - type: strip

            - type: regex
              pattern: "\\s+"
              replacement: " "

    discovery:

      - type: detail_link

        selector:
          type: css
          selector: "article a"

      - type: next_page

        selector:
          type: css
          selector: "a.next"