name: ai-space
environment: development
default_spider: news

runtime:

  engine:
    concurrency: 8
    timeout: 30

  throttle:
    delay: 0.5
    concurrency: 2
proxies:
  - name: local
    type: static
    proxy:
      url: socks5://127.0.0.1:1080

  - name: france
    type: country
    country: FR
    proxies:
      - url: socks5://127.0.0.1:1081
        country: FR
      - url: socks5://127.0.0.1:1082
        country: FR
user_agents:
  - name: chrome
    type: random
    values:
      - "Mozilla/5.0 (...) Chrome/140..."
      - "Mozilla/5.0 (...) Chrome/141..."
      - "Mozilla/5.0 (...) Chrome/142..."
  - name: pool
    type: pool
    providers:
      - local
      - france
    strategy: round_robin
spiders:

  - name: news
    template: list
    kind: list

    profile:
      downloader:
        type: httpx
        config:
          timeout: 30
          verify_ssl: true
          follow_redirects: true
          max_redirects: 20
          http2: false

      response_format: html

    start_requests:
      - url: https://example.com/news

    middlewares:

      - type: retry
        priority: 100
        config:
          max_retries: 3
          retry_delay: 1.0
          backoff_factor: 2.0
          max_delay: 30.0

      - type: auth
        priority: 90
        config:
          override_headers: false
          override_cookies: false
          override_params: false

      - type: cache
        priority: 80
        config:
          read: true
          write: true
          methods:
            - GET
            - HEAD

      - type: cookie
        priority: 70

      - type: deduplicate
        priority: 60

      - type: fingerprint
        priority: 50

      - type: proxy
        priority: 40
        config:
          override: false

      - type: session
        priority: 30
        config:
          default_session_id: null
          create_if_missing: true
          save_after_request: true

      - type: throttle
        priority: 20
    extraction:

      type: object
      name: article

      children:

        - type: field
          name: title

          source:
            type: selector

            selector:
              type: css
              selector: "h1.title"

          required: true

          transforms:
            - type: strip

            - type: regex
              pattern: "\\s+"
              replacement: " "

    discovery:

      - type: detail_link

        selector:
          type: css
          selector: "article a"

      - type: next_page

        selector:
          type: css
          selector: "a.next"