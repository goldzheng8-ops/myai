name: example_news

template: list
kind: list

profile:
  downloader:

    type: httpx
    config:
      timeout: 30
      verify_ssl: true
      follow_redirects: true
      max_redirects: 20
      http2: false
  response_format: html

start_requests:

  - url: "https://example.com/news"
    method: GET
    timeout: 30


middlewares:

  - type: fingerprint
    enabled: true
    priority: 100

    config: {}

  - type: retry
    enabled: true
    priority: 200

    config:
      max_retries: 3
      backoff: 1.0

extraction:

  type: object
  name: article

  children:

    - type: field
      name: title

      source:
        type: selector

        selector:
          type: css
          selector: "h1.title"

      required: true

      transforms:
        - type: strip

        - type: regex
          pattern: "\\s+"
          replacement: " "

discovery:

  - type: detail_link

    selector:
      type: css
      selector: "article a"

  - type: next_page

    selector:
      type: css
      selector: "a.next"