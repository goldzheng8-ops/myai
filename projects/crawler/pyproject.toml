[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler"
version = "0.1.0"
description = "Scrapy microservice for AI-SPACE"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.116",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "markdown>=3.10.3",
    "uvicorn[standard]>=0.35",
    "scrapy[httpx]>=2.18",
    "httpx>=0.28",
    "fake-useragent>=2.2.0",
    "scrapy-playwright>=0.0.48",
    "scrapy-rotating-proxies>=0.6.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.10",
    "jmespath>=1.1.0",
    "jsonpath-ng>=1.8.0",
    "jinja2>=3.1.6",
    "cachetools>=7.1.6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "black",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "application*",
    "core*"
]
